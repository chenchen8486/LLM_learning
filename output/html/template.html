<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — LLM 机制学习手册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}]});"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script defer src="static/annotate.js"></script>
{{GLOBAL_STYLES}}
{{PAGE_STYLES}}
<script>
// 目录显隐状态提前解析（在 body 渲染前打类，避免闪烁）；默认桌面展开、移动端收起
(function(){var s=null;try{s=localStorage.getItem('llm_nav')}catch(e){}
var on=s?s==='on':!window.matchMedia('(max-width:768px)').matches;
document.documentElement.classList.add(on?'nav-on':'nav-off');})();
</script>
</head>
<body>
{{SIDEBAR}}
<button class="sidebar-show-btn" onclick="toggleSidebar()" title="展开目录">☰ 目录</button>
<div class="layout">
  <div class="main">
    {{BREADCRUMB}}
    <div class="content">
      {{CONTENT}}
      {{FOOTER_NAV}}
    </div>
  </div>
</div>
<script>
// Sidebar toggle 全局脚本，所有页面共享
function toggleNav(el){
  el.classList.toggle('collapsed');
  const children = el.nextElementSibling;
  if(children && children.classList.contains('nav-children')){
    children.classList.toggle('collapsed');
    children.style.maxHeight = children.classList.contains('collapsed') ? '0' : '2000px';
  }
}

// 整个目录侧栏的收起/展开（状态存 localStorage，跨页面记忆）
function toggleSidebar(){
  const h=document.documentElement;
  const show=h.classList.contains('nav-off');
  h.classList.toggle('nav-on',show);
  h.classList.toggle('nav-off',!show);
  try{localStorage.setItem('llm_nav',show?'on':'off')}catch(e){}
}

// 图片点击放大/拖拽/滚轮缩放
(function(){
  let overlay=null, img=null, scale=1, isDragging=false, startX=0, startY=0, translateX=0, translateY=0;
  function openZoom(src){
    if(overlay) return;
    overlay=document.createElement('div'); overlay.className='img-zoom-overlay';
    img=document.createElement('img'); img.src=src; img.draggable=false;
    overlay.appendChild(img); document.body.appendChild(overlay);
    scale=1; translateX=0; translateY=0; updateTransform();
    overlay.addEventListener('click', closeZoom);
    overlay.addEventListener('wheel', onWheel, {passive:false});
    overlay.addEventListener('mousedown', onMouseDown);
    overlay.addEventListener('mousemove', onMouseMove);
    overlay.addEventListener('mouseup', onMouseUp);
    overlay.addEventListener('mouseleave', onMouseUp);
  }
  function closeZoom(){ if(!overlay) return; overlay.remove(); overlay=null; img=null; }
  function updateTransform(){ img.style.transform='translate('+translateX+'px,'+translateY+'px) scale('+scale+')'; }
  function onWheel(e){ e.preventDefault(); scale *= e.deltaY<0 ? 1.1 : 0.9; scale=Math.min(Math.max(scale,0.5),5); updateTransform(); }
  function onMouseDown(e){ if(e.target!==img) return; isDragging=true; startX=e.clientX-translateX; startY=e.clientY-translateY; img.classList.add('is-dragging'); }
  function onMouseMove(e){ if(!isDragging) return; translateX=e.clientX-startX; translateY=e.clientY-startY; updateTransform(); }
  function onMouseUp(){ isDragging=false; if(img) img.classList.remove('is-dragging'); }
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('.img-block img').forEach(function(el){ el.addEventListener('click', function(){ openZoom(el.src); }); });
  });
})();
</script>
{{BODY_SCRIPT}}
</body>
</html>
